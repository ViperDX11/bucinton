<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bucinton Tournament</title>

  <!-- Mempercepat navigasi ke server Google yang akan dituju sebentar lagi -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- Web App Manifest untuk fitur "Install app" - dipertahankan di sini supaya siapa pun yang
       "Add to Home Screen" dari halaman ini (sebelum sempat redirect) tetap dapat ikon & nama
       app yang benar. Shortcut yang tersimpan akan tetap menunjuk ke alamat GitHub Pages ini -
       setiap dibuka, halaman ini akan langsung redirect ke app yang sebenarnya. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bucinton">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #121212;
    }
    /* Splash - tampil SEJAK DETIK PERTAMA halaman ini dibuka (disajikan lewat CDN GitHub Pages
       yang sangat cepat). BERBEDA dari versi sebelumnya: splash ini TIDAK menunggu sinyal "siap"
       dari app manapun (tidak ada lagi iframe untuk didengarkan) - splash ini cuma tampil sekilas
       lalu langsung redirect penuh ke app yang sebenarnya (lihat script di bawah). App yang
       sebenarnya (Formsupa.html di sisi Google) punya splash/loading-nya SENDIRI yang mengambil
       alih begitu navigasi selesai - didesain dengan warna & gaya yang SAMA PERSIS supaya
       transisinya terasa menyambung, bukan dua splash yang berbeda tampilannya.
       ALASAN PERUBAHAN INI (2026): sebelumnya app dimuat lewat <iframe> supaya splash ini bisa
       "menutupi" app yang sedang loading di baliknya. Tapi browser modern (Safari & Chrome)
       membatasi/mempartisi localStorage untuk iframe lintas-domain seperti itu - membuat
       Persistent Admin Login tidak pernah benar-benar tersimpan. Redirect penuh menghilangkan
       pembatasan itu sepenuhnya, DAN membuka kemungkinan login dengan Face ID/fingerprint di
       masa depan (WebAuthn juga dibatasi ketat di iframe lintas-domain). -->
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #121212;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #splashScreen img {
      width: 300px;
      height: 300px;
    }
  </style>
</head>
<body>
  <div id="splashScreen">
    <img src="loading.gif" alt="Loading">
  </div>

  <script>
    // GANTI URL DI BAWAH INI KALAU SUATU SAAT APP PINDAH ALAMAT LAGI
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwRsmv1oSndqSGanLcVVmjYmCz4oR_J1vptSO3Fpcjgp18vTBPBVY0wNcP6svHID-5NSQ/exec';

    // location.replace() (BUKAN location.href) - supaya halaman splash ini TIDAK masuk ke
    // riwayat browser. Kalau pakai location.href biasa, tombol "Back" di app nanti akan
    // membawa pengguna kembali ke halaman splash ini (yang langsung redirect lagi) alih-alih
    // benar-benar keluar dari app - dengan replace(), browser melompati halaman ini sepenuhnya.
    window.location.replace(APP_URL);
  </script>
</body>
</html>
