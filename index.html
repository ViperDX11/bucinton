<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bucinton Tournament</title>

  <!-- Mempercepat koneksi awal ke server Google -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- Web App Manifest untuk fitur "Install app" di Android Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F3864">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Ikon untuk Add to Home Screen -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- Supaya tampil fullscreen tanpa address bar di iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bucinton">

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #F7F8FA; }
    iframe { width: 100%; height: 100vh; height: 100dvh; border: none; display: block; }
  </style>


</head>
<body>
  <!-- GANTI URL DI BAWAH INI DENGAN LINK WEB APP ANDA (yang berakhiran /exec) -->
  <iframe src="https://script.google.com/macros/s/AKfycbyMTYWq68psOCeblD_a_3NLstG5jyUw9r6V84H9RaLt5LfwlRFzU2hHqYrXK5DGw3sz/exec"></iframe>
  <script>
    // Terima kabar dari app di dalam iframe soal tema yang sedang aktif (Light/Auto/Dark), supaya
    // warna latar wrapper ini ikut sinkron - ini yang kelihatan saat overscroll/pantulan scroll di iOS.
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'bucintonTheme') {
        var color = e.data.isDark ? '#121212' : '#F7F8FA';
        document.documentElement.style.background = color;
        document.body.style.background = color;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', e.data.isDark ? '#121212' : '#1F3864');
      }
    });
  </script>
</body>
</html>
