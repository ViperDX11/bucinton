<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bucinton Tournament</title>

  <!-- Mempercepat koneksi awal ke server Google -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- Web App Manifest untuk fitur "Install app" di Android Chrome -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Ikon untuk Add to Home Screen -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- Supaya tampil fullscreen tanpa address bar di iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bucinton">

 <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: auto; 
    -webkit-overflow-scrolling: touch; 
      /* Mengubah background utama menjadi hitam agar white bar hilang */
      background: #121212; 
    }
    iframe { 
    width: 100%; 
    /* Menggunakan tinggi dinamis safe area */
    height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    /* Memberikan jarak atas agar tidak menabrak status bar */
    margin-top: env(safe-area-inset-top);
    border: none; 
    display: block; 
  }
  </style> 
</head>
<body>
  <!-- GANTI URL DI BAWAH INI DENGAN LINK WEB APP ANDA (yang berakhiran /exec) -->
  <iframe src="https://script.google.com/macros/s/AKfycbzNAgO2W1lOIyA5sWVx6hr3aKSqhhvAXKBXSyB71y2RqiBoBwmYvX5DTnmI8VN7nlc3/exec"></iframe>
</body>
</html>
