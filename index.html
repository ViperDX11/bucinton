<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bucinton Tournament</title>

  <!-- Mempercepat koneksi awal ke server Google -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.google.com">

  <!-- Web App Manifest untuk fitur "Install app" di Android Chrome -->
  <link rel="manifest" href="manifest.json">
  <!-- Warna fallback sebelum pesan tema pertama diterima dari iframe (lihat script di bawah).
       SENGAJA dibuat gelap secara permanen (bukan mengikuti tema aktif) - kedipan gelap→terang
       (kalau tema aktif ternyata Light) jauh lebih halus dilihat dibanding terang→gelap. Jadi
       tidak perlu diubah lagi tiap ganti tema, kecuali Anda ingin menyesuaikan lebih lanjut. -->
  <meta name="theme-color" id="metaThemeColor" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Ikon untuk Add to Home Screen -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- Supaya tampil fullscreen tanpa address bar di iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bucinton">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      /* Warna fallback (sama seperti meta theme-color di atas) - langsung ditimpa begitu pesan
         tema pertama diterima dari iframe lewat script di bawah. Sengaja dibuat gelap secara
         permanen (lihat komentar di meta theme-color) - tidak perlu ikut diubah tiap ganti tema. */
      background: #121212;
    }
    iframe {
      width: 100%;
      /* Mengurangi tinggi total layar dengan tinggi safe area atas (status bar) */
      height: calc(100dvh - env(safe-area-inset-top, 20px));
      border: none;
      display: block;
    }
    /* Splash screen - tampil SEJAK DETIK PERTAMA halaman ini dibuka (disajikan lewat CDN GitHub
       Pages yang sangat cepat, TIDAK terpengaruh delay cold-start Apps Script di dalam iframe),
       menutupi proses loading iframe di baliknya sampai app di dalamnya benar-benar siap. */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #121212;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.3s ease;
    }
    #splashScreen img {
      width: 200px;
      height: 200px;
    }
    #splashScreen div {
      color: #b2a36f;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Splash screen - disembunyikan lewat script di bawah setelah app di dalam iframe mengirim
       sinyal "siap" (pesan bucintonTheme, dikirim Form.html di langkah PALING TERAKHIR proses
       inisialisasinya) - bukan sekadar menunggu iframe "termuat", tapi menunggu app-nya
       benar-benar SELESAI proses setup dan siap dipakai. -->
  <div id="splashScreen">
    <img src="loading.gif" alt="Loading">
    <div>Loading...</div>
  </div>

  <!-- GANTI URL DI BAWAH INI DENGAN LINK WEB APP ANDA (yang berakhiran /exec) -->
  <iframe src="https://script.google.com/macros/s/AKfycbzNAgO2W1lOIyA5sWVx6hr3aKSqhhvAXKBXSyB71y2RqiBoBwmYvX5DTnmI8VN7nlc3/exec"></iframe>

  <script>
    // Dengarkan pesan tema dari Form.html (di dalam iframe) - dikirim setiap kali tema aktif
    // diterapkan (baik saat app pertama dibuka, maupun saat admin ganti tema di Theme Settings).
    // Ini yang bikin warna latar & status bar-area index.html ini otomatis menyesuaikan, tanpa
    // perlu edit manual tiap kali warna tema berubah. Kemunculan PERTAMA pesan ini juga dipakai
    // sebagai sinyal "app sudah siap" untuk menyembunyikan splash screen (lihat di bawah).
    let splashHidden = false;
    function hideSplash() {
      if (splashHidden) return;
      splashHidden = true;
      const splash = document.getElementById('splashScreen');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function() { splash.style.display = 'none'; }, 300);
    }

    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'bucintonTheme' || !e.data.bgPage) return;
      document.body.style.background = e.data.bgPage;
      document.documentElement.style.background = e.data.bgPage;
      const meta = document.getElementById('metaThemeColor');
      if (meta) meta.setAttribute('content', e.data.bgPage);
      hideSplash(); // sinyal pertama dari app di dalam iframe = app sudah siap
    });

    // Lapisan pengaman independen - kalau untuk alasan apapun pesan di atas tidak pernah
    // diterima (misal app di dalam iframe versi lama, atau gagal), splash tetap disembunyikan
    // setelah 10 detik supaya tidak tersangkut selamanya menutupi app.
    setTimeout(hideSplash, 10000);
  </script>
</body>
</html>
